    compileSdk 35

    defaultConfig {
        applicationId "com.careerpath"
        minSdk 21
        targetSdk 28
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
